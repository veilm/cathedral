[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cathedral-memory"
version = "0.1.0"
description = "A small, filesystem-first memory system for LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Cathedral contributors" }]
dependencies = []

[project.scripts]
cathedral = "cathedral.cli:main"

[tool.setuptools.package-data]
cathedral = ["templates/*.md", "templates/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

